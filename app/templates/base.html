<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="/">{{ settings.app_name }}</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="/" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a></li>
          {% for p in nav %}
          <li>
            <a href="/{{ p.slug }}" {% if active == p.slug %}aria-current="page"{% endif %}>
              {{ p.nav_label }}
              {% if p.status != 'done' %}<span class="soon">Phase {{ p.number }}</span>{% endif %}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      <p class="side-foot">v{{ settings.app_version }}, {{ settings.environment }}</p>
    </aside>
    <main id="main" class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
